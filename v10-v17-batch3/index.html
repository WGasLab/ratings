<script>
const DATA = [{"i": 0, "prompt": "disco track with male vocals, 80's vibe", "tracks": [{"arm": "B", "src": "audio/00-B.mp3"}, {"arm": "A", "src": "audio/00-A.mp3"}]}, {"i": 1, "prompt": "jazz house track , 125 bpm with saxophone", "tracks": [{"arm": "B", "src": "audio/01-B.mp3"}, {"arm": "A", "src": "audio/01-A.mp3"}]}, {"i": 2, "prompt": "Reinier 135 techno", "tracks": [{"arm": "B", "src": "audio/02-B.mp3"}, {"arm": "A", "src": "audio/02-A.mp3"}]}, {"i": 3, "prompt": "Trance, 130 pbm, no vocal", "tracks": [{"arm": "A", "src": "audio/03-A.mp3"}, {"arm": "B", "src": "audio/03-B.mp3"}]}, {"i": 4, "prompt": "deephouse 125 bmp no vocal", "tracks": [{"arm": "B", "src": "audio/04-B.mp3"}, {"arm": "A", "src": "audio/04-A.mp3"}]}, {"i": 5, "prompt": "deep house tune with no vocals", "tracks": [{"arm": "B", "src": "audio/05-B.mp3"}, {"arm": "A", "src": "audio/05-A.mp3"}]}, {"i": 6, "prompt": "A 4x4 house music track with a good, funky beat and bassline, and a cut-up vocal track, maybe with a bit of an early garage kind of sound or even UK garage kind of sound", "tracks": [{"arm": "A", "src": "audio/06-A.mp3"}, {"arm": "B", "src": "audio/06-B.mp3"}]}, {"i": 7, "prompt": "Please start with a hip-hop/old-school funk baseline and add to that a craftwork-style beat. I want very chopped-up, very choppy vocals, really cut up, like speed garage style. Just another interesting element that you think would be kind of weird and bizarre to add in on top of that", "tracks": [{"arm": "B", "src": "audio/07-B.mp3"}, {"arm": "A", "src": "audio/07-A.mp3"}]}, {"i": 8, "prompt": "Make something glitchy and abstract that doesn’t follow conventional rules of how we usually create music", "tracks": [{"arm": "A", "src": "audio/08-A.mp3"}, {"arm": "B", "src": "audio/08-B.mp3"}]}, {"i": 9, "prompt": "A never ending buildup without a drop, just increasing in tension and energy until its just absurd", "tracks": [{"arm": "A", "src": "audio/09-A.mp3"}, {"arm": "B", "src": "audio/09-B.mp3"}]}, {"i": 10, "prompt": "A mid-tempo Kraftwerk-style song with hi-hats and timpani and a robot vocal that's singing about the joys of spring.", "tracks": [{"arm": "B", "src": "audio/10-B.mp3"}, {"arm": "A", "src": "audio/10-A.mp3"}]}, {"i": 11, "prompt": "a deep house track with touches of early dub techno, a lot of atmospheric noise floor and off grid percussive elements that form a wonky hook to the piece. Include a single word male vocal that is deeply groovy and forms a polyrhythm across the track", "tracks": [{"arm": "A", "src": "audio/11-A.mp3"}, {"arm": "B", "src": "audio/11-B.mp3"}]}, {"i": 12, "prompt": "dub techno track with vintage sound tape hiss and my bloody valentine wall of sound", "tracks": [{"arm": "B", "src": "audio/12-B.mp3"}, {"arm": "A", "src": "audio/12-A.mp3"}]}, {"i": 13, "prompt": "hans Zimmer episch, gecombineerd met Beethoven 7e symfonie beetje filmmuziek en gebruikt voor aankondiging symposium, geen tekst", "tracks": [{"arm": "A", "src": "audio/13-A.mp3"}, {"arm": "B", "src": "audio/13-B.mp3"}]}, {"i": 14, "prompt": "House track met vocals lekker met de meiden", "tracks": [{"arm": "B", "src": "audio/14-B.mp3"}, {"arm": "A", "src": "audio/14-A.mp3"}]}, {"i": 15, "prompt": "Nineties dance classic uptempo female vocals", "tracks": [{"arm": "A", "src": "audio/15-A.mp3"}, {"arm": "B", "src": "audio/15-B.mp3"}]}, {"i": 16, "prompt": "Dominik eulberg style track, bpm 122, trancy", "tracks": [{"arm": "B", "src": "audio/16-B.mp3"}, {"arm": "A", "src": "audio/16-A.mp3"}]}, {"i": 17, "prompt": "indie dance, tech house, indie alternative, rough ghetto, cool, indie singer", "tracks": [{"arm": "B", "src": "audio/17-B.mp3"}, {"arm": "A", "src": "audio/17-A.mp3"}]}, {"i": 18, "prompt": "deep house banger", "tracks": [{"arm": "B", "src": "audio/18-B.mp3"}, {"arm": "A", "src": "audio/18-A.mp3"}]}, {"i": 19, "prompt": "Funky disco dance sound with reggae elements and a saxophone", "tracks": [{"arm": "B", "src": "audio/19-B.mp3"}, {"arm": "A", "src": "audio/19-A.mp3"}]}, {"i": 20, "prompt": "Sexy Ibiza house", "tracks": [{"arm": "A", "src": "audio/20-A.mp3"}, {"arm": "B", "src": "audio/20-B.mp3"}]}, {"i": 21, "prompt": "make a raw techno track. rolling groove, industrial soundeffects, male vocal shouts", "tracks": [{"arm": "A", "src": "audio/21-A.mp3"}, {"arm": "B", "src": "audio/21-B.mp3"}]}, {"i": 22, "prompt": "Create a dark, relentless peak-time techno track at 138 BPM in F minor. Use a huge, tightly controlled four-on-the-floor kick, deep rolling sub-bass, rumbling low-end percussion, sharp metallic hi-hats, and hypnotic warehouse ambience. Introduce a distorted acid synth sequence that gradually evolves through filter modulation, resonance, automation, and rhythmic variation. Keep the harmony minimal and ominous.\n\nBuild tension with industrial textures, short atmospheric breaks, rising noise, restrained snare r", "tracks": [{"arm": "A", "src": "audio/22-A.mp3"}, {"arm": "B", "src": "audio/22-B.mp3"}]}, {"i": 23, "prompt": "Techno Pan-Pot Raw Deep Minimal hypnotic", "tracks": [{"arm": "B", "src": "audio/23-B.mp3"}, {"arm": "A", "src": "audio/23-A.mp3"}]}, {"i": 24, "prompt": "create a song for my next running race, something around 120 bpm / highly motivating but with a 80s song vibe and the voice of Abba's singer", "tracks": [{"arm": "A", "src": "audio/24-A.mp3"}, {"arm": "B", "src": "audio/24-B.mp3"}]}];
const ARMS = {"A": ["V1.0", "V1's chain, rendered directly: no 5Hz enhancer, prompt unlocked"], "B": ["V1.7", "V1.7 with Reinier's branches (techno with his loops, disco, deep house) and the artist rule, rendered directly: no 5Hz enhancer"]};
const KEY = "v10v17b3";
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>';
const $ = id => document.getElementById(id);
const clock = t => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? n.className = v : k.startsWith("on") ? n.addEventListener(k.slice(2), v) : n.setAttribute(k, v);
  for (const k of kids) if (k != null) n.append(k);
  return n;
}

let myPicks = store.get(`rate:${KEY}`) || {}, allVotes = {}, saveRemote = null, shared = false;
let idx = Math.min(store.get(`rate:${KEY}:at`) || 0, DATA.length - 1), view = "pair";
const audios = [];
function stopAll() { audios.forEach(a => a.pause()); }

function player(src) {
  const audio = new Audio(); audio.preload = "none"; audio.src = src;
  const btn = el("button", { class: "play", type: "button", "aria-label": "Play" });
  const seek = el("input", { class: "seek", type: "range", min: "0", max: "60", step: "0.1", value: "0", "aria-label": "Position" });
  const time = el("span", { class: "time" }, "0:00");
  btn.innerHTML = ICON_PLAY;
  btn.addEventListener("click", () => { if (audio.paused) { stopAll(); audio.play().catch(() => {}); } else audio.pause(); });
  audio.addEventListener("play", () => { btn.innerHTML = ICON_PAUSE; btn.setAttribute("aria-label", "Pause"); });
  audio.addEventListener("pause", () => { btn.innerHTML = ICON_PLAY; btn.setAttribute("aria-label", "Play"); });
  audio.addEventListener("loadedmetadata", () => { seek.max = String(audio.duration || 60); });
  audio.addEventListener("timeupdate", () => { seek.value = String(audio.currentTime); time.textContent = clock(audio.currentTime); });
  seek.addEventListener("input", () => { audio.currentTime = Number(seek.value); });
  audios.push(audio);
  return el("div", { class: "player" }, btn, seek, time);
}

// One card per track, built once per pair; the order in DATA is the blind order, the same for everyone
const cards = DATA.map(pair => pair.tracks.map((t, k) => {
  const pick = el("button", { class: "pick", type: "button", onclick: () => choose(pair.i, t.arm) }, `Pick track ${k + 1}`);
  const badge = el("span", { class: "badge", hidden: "" }, "Your pick");
  const card = el("article", { class: "track", "aria-label": `Track ${k + 1}` },
    el("div", { class: "track-head" }, el("span", { class: "tname" }, `Track ${k + 1}`), badge),
    t.src ? player(t.src) : el("p", { class: "failed" }, "This render failed."), pick);
  if (!t.src) pick.disabled = true;
  return { arm: t.arm, card, pick, badge };
}));

function rated() { return DATA.filter(p => myPicks[p.i]).length; }
function render() {
  const n = rated();
  $("barFill").style.width = `${Math.round(100 * n / DATA.length)}%`;
  $("count").textContent = `${n} of ${DATA.length} rated`;
  $("pairView").hidden = view !== "pair"; $("doneView").hidden = view !== "done";
  $("prev").disabled = view === "pair" && idx === 0;
  $("next").textContent = view === "done" ? "Start again" : idx === DATA.length - 1 ? "Finish" : "Next ›";
  if (view === "done") return renderDone();
  const pair = DATA[idx];
  $("pairNo").textContent = `Pair ${idx + 1} of ${DATA.length}`;
  $("prompt").textContent = pair.prompt;
  $("prompt").classList.add("clamped");
  requestAnimationFrame(() => { $("more").hidden = $("prompt").scrollHeight <= $("prompt").clientHeight + 2; });
  $("tracks").replaceChildren(...cards[idx].map((c, k) => {
    const on = myPicks[pair.i] === c.arm;
    c.card.classList.toggle("picked", on); c.badge.hidden = !on;
    if (!c.pick.disabled) c.pick.textContent = on ? "Your pick" : `Pick track ${k + 1}`;
    return c.card;
  }));
  $("neither").setAttribute("aria-pressed", String(myPicks[pair.i] === "none"));
  store.set(`rate:${KEY}:at`, idx);
}

function renderDone() {
  const n = rated();
  $("doneTitle").textContent = n === DATA.length ? "Thanks, that's all of them" : `You rated ${n} of ${DATA.length} pairs`;
  $("doneLede").textContent = !shared ? (n === DATA.length ? "Send your picks with the WhatsApp button below." : "You can go back and rate the rest, or send what you have with the button below.")
    : n === DATA.length ? "Below is how the versions are doing so far, over everyone who rated." : "You can go back and rate the rest; below is how the versions are doing so far.";
  const votes = Object.values(allVotes).flatMap(p => Object.values(p || {}));
  const total = votes.length || 1;
  const rows = [...Object.keys(ARMS), "none"].map(arm => {
    const count = votes.filter(v => v === arm).length;
    const [name, detail] = arm === "none" ? ["Neither", "neither track worked"] : ARMS[arm];
    const fill = el("div", { class: `res-fill${arm === "none" ? " none" : ""}` });
    requestAnimationFrame(() => { fill.style.width = `${Math.round(100 * count / total)}%`; });
    return el("div", { class: "res-row" },
      el("div", { class: "res-line" }, el("span", { class: "res-name" }, name, el("small", {}, detail)), el("span", { class: "res-num" }, `${count} · ${Math.round(100 * count / total)}%`)),
      el("div", { class: "res-track" }, fill));
  });
  $("resRows").replaceChildren(...rows);
  const people = Object.values(allVotes).filter(p => Object.keys(p || {}).length).length;
  $("raters").textContent = shared ? `${people} ${people === 1 ? "person has" : "people have"} rated so far.` : "These are your own picks. Send them with the button below.";
  $("resTitle").textContent = shared ? "Results so far" : "Your picks";
  $("send").hidden = shared;
  $("waBtn").href = `https://wa.me/?text=${encodeURIComponent(picksText())}`;
}

function choose(i, arm) {
  myPicks = { ...myPicks, [i]: myPicks[i] === arm && arm === "none" ? undefined : arm };
  if (!myPicks[i]) delete myPicks[i];
  store.set(`rate:${KEY}`, myPicks);
  allVotes = { ...allVotes, me: myPicks };
  if (saveRemote) saveRemote();
  render();
  if (myPicks[i]) setTimeout(() => {  // on to the next pair you haven't rated
    if (view !== "pair" || DATA[idx].i !== i) return;
    stopAll();
    const next = DATA.findIndex((p, k) => k > idx && !myPicks[p.i]);
    if (next >= 0) idx = next; else if (rated() === DATA.length) view = "done"; else if (idx < DATA.length - 1) idx++;
    render(); window.scrollTo({ top: 0, behavior: "smooth" });
  }, 650);
}

$("neither").addEventListener("click", () => choose(DATA[idx].i, "none"));
$("more").addEventListener("click", () => { $("prompt").classList.remove("clamped"); $("more").hidden = true; });
$("prev").addEventListener("click", () => { stopAll(); if (view === "done") { view = "pair"; idx = DATA.length - 1; } else if (idx > 0) idx--; render(); window.scrollTo({ top: 0 }); });
$("next").addEventListener("click", () => { stopAll(); if (view === "done") { view = "pair"; idx = 0; } else if (idx < DATA.length - 1) idx++; else view = "done"; render(); window.scrollTo({ top: 0 }); });
$("count").addEventListener("click", () => { stopAll(); view = "done"; render(); });
$("review").addEventListener("click", () => { view = "pair"; const open = DATA.findIndex(p => !myPicks[p.i]); idx = open >= 0 ? open : 0; render(); window.scrollTo({ top: 0 }); });
document.addEventListener("keydown", e => {
  if (view !== "pair" || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") $("next").click(); else if (e.key === "ArrowLeft") $("prev").click();
  else if (e.key === "1" || e.key === "2") { const c = cards[idx][Number(e.key) - 1]; if (c && !c.pick.disabled) c.pick.click(); }
});

// The picks as a short text: pair number - track number (0 = neither), to send to whoever shared the page
function picksText() {
  return `${KEY} ` + DATA.map((p, k) => myPicks[p.i] ? `${k + 1}-${myPicks[p.i] === "none" ? 0 : p.tracks.findIndex(t => t.arm === myPicks[p.i]) + 1}` : null).filter(Boolean).join(" ");
}
$("sendBtn").addEventListener("click", async () => {
  const text = picksText();
  $("sendText").value = text; $("sendText").hidden = false; $("sendText").select();
  try { await navigator.clipboard.writeText(text); $("sendBtn").textContent = "Copied: paste it in a message"; } catch (e) { $("sendBtn").textContent = "Copy the text below"; }
});

function local(why) {
  shared = false; allVotes = { me: myPicks };
  $("status").textContent = why;
  render();
}
allVotes = { me: myPicks };
render();

(async () => {
  const [db, user] = window.claude ? await Promise.all([claude.use("db"), claude.use("user")]) : [null, null];
  const uid = user ? await user.id() : null;
  const offline = "Your picks are kept on this phone. At the end you send them with one tap.";
  if (!db || !uid || (await user.can("data.write")) === false) return local(offline);
  shared = true;
  $("status").textContent = "Your picks are saved as you go.";
  let writing = null, queued = false;
  saveRemote = async () => {
    if (writing) { queued = true; return; }
    writing = db.doc(`votes/${uid}`).set({ picks: myPicks, at: Date.now() });
    try { await writing; } catch (e) {
      writing = null; saveRemote = null;
      return local(e && e.code === "invalid_argument" ? offline : "Couldn't save your pick just now; it's kept on this phone. Check your connection and reload.");
    }
    writing = null;
    if (queued) { queued = false; saveRemote(); }
  };
  let first = true;
  db.collection("votes").onSnapshot(snap => {
    allVotes = {}; snap.docs.forEach(d => { allVotes[d.id] = (d.data() || {}).picks || {}; });
    if (first) {  // picks made before the connection (or on an earlier visit) join the saved ones
      first = false;
      myPicks = { ...(allVotes[uid] || {}), ...myPicks };
      if (Object.keys(myPicks).length) saveRemote();
    } else if (allVotes[uid] && !writing) myPicks = { ...allVotes[uid] };
    allVotes[uid] = myPicks;
    store.set(`rate:${KEY}`, myPicks);
    render();
  }, () => { $("status").textContent = "Lost the connection to the shared votes. Your picks stay on this phone; reload to reconnect."; });
})();
</script>
<style>
.offline { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.offline p { margin: 0; font-size: 14px; color: var(--muted); } .offline b { color: var(--fg); }
.offline button { min-height: 46px; border-radius: 12px; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); font-weight: 700; font-size: 15px; }
.offline.ready { border-color: var(--ok); } .offline.ready b { color: var(--ok); }
</style>
<script>
(() => {  // offline: the page is kept by the worker; "Save for offline" stores every song of this test
  if (!("serviceWorker" in navigator) || !("caches" in window)) return;
  navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});
  const urls = [...new Set(DATA.flatMap(p => p.tracks.map(t => t.src).filter(Boolean)))].map(u => new URL(u, location.href).href);
  const mb = Math.round(urls.length * 0.96);
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const home = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
  const box = el("section", { class: "offline", "aria-live": "polite" }), text = el("p"), btn = el("button", { type: "button" }, `Save for offline (${mb} MB)`);
  const tip = ios && !home ? el("p", {}, "On iPhone: first tap Share, then “Add to Home Screen”, open the test from there and save it there. Safari and the Home Screen keep separate copies.") : null;
  box.append(text, ...(tip ? [tip] : []), btn);
  document.querySelector(".top").after(box);
  async function count() { const c = await caches.open("ratings-v1"); return (await Promise.all(urls.map(u => c.match(u)))).filter(Boolean).length; }
  async function show() {
    const n = await count();
    const done = n === urls.length;
    box.classList.toggle("ready", done); btn.hidden = done; if (tip) tip.hidden = done;
    text.replaceChildren(...(done ? [el("b", {}, "Saved on this phone."), " This test works without internet now."]
      : [el("b", {}, "Rate without internet?"), ` Save the ${urls.length} songs on your phone first, while you have Wi-Fi.` + (n ? ` (${n} already saved)` : "")]));
  }
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
    const c = await caches.open("ratings-v1");
    try { await c.put(location.origin + location.pathname, await fetch(location.pathname, { cache: "reload" })); } catch (e) {}
    let n = 0, failed = 0;
    for (const u of urls) {
      if (!(await c.match(u))) { try { const r = await fetch(u); if (r.ok && r.status === 200) await c.put(u, r); else failed++; } catch (e) { failed++; } }
      btn.textContent = `Saving… ${++n} of ${urls.length}`;
    }
    btn.disabled = false; btn.textContent = failed ? `Some songs didn't save: tap to try again` : `Save for offline (${mb} MB)`;
    show();
  });
  show();
})();
</script></body></html>
